<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2a1f14">
  <title>SBNTS | Similar But Not The Same</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Page styles: colors, typography, spacing, and responsive layout -->
  <style>
    :root { --ink:#2a1f14; --paper:#faf3e7; --clay:#c14f00; --line:rgba(250,243,231,.22); }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:var(--ink); color:var(--paper); font-family:Jost, sans-serif; }
    .hero { min-height:100svh; position:relative; isolation:isolate; overflow:hidden; display:flex; flex-direction:column; }
    #dust { position:absolute; inset:0; width:100%; height:100%; z-index:-2; }
    .wash { position:absolute; inset:0; z-index:-1; background:linear-gradient(110deg, rgba(42,31,20,.98) 5%, rgba(42,31,20,.72) 56%, rgba(42,31,20,.9)); }
    .grain { position:absolute; inset:0; pointer-events:none; opacity:.17; z-index:0; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.38'/%3E%3C/svg%3E"); }
    nav { min-height:82px; padding:20px clamp(22px,5vw,72px); position:relative; z-index:2; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line); }
    .wordmark { color:var(--paper); font-family:"Cormorant Garamond", serif; font-size:1.45rem; font-weight:500; letter-spacing:.16em; text-decoration:none; }
    .nav-link { color:var(--paper); text-decoration:none; text-transform:uppercase; letter-spacing:.14em; font-size:.68rem; font-weight:600; padding:12px 0; border-bottom:1px solid transparent; transition:border-color .25s; }
    .nav-link:hover, .nav-link:focus-visible { border-color:var(--clay); }
    .content { width:min(1180px,100%); margin:auto; padding:clamp(68px,10vh,130px) clamp(22px,8vw,110px) 42px; flex:1; display:flex; flex-direction:column; justify-content:center; position:relative; z-index:1; }
    .eyebrow { color:#e8966a; margin:0 0 20px; font-size:.68rem; font-weight:600; letter-spacing:.24em; text-transform:uppercase; }
    h1 { margin:0; max-width:790px; font-family:"Cormorant Garamond", Georgia, serif; font-size:clamp(4rem,11vw,10.5rem); font-weight:400; letter-spacing:0; line-height:.76; }
    h1 em { color:#e8966a; font-style:italic; }
    .subcopy { max-width:370px; margin:32px 0 0; color:rgba(250,243,231,.75); font-size:clamp(.92rem,1.3vw,1.05rem); line-height:1.75; }
    .actions { display:flex; align-items:center; flex-wrap:wrap; gap:20px; margin-top:34px; }
    .button { display:inline-flex; align-items:center; justify-content:center; min-height:52px; padding:0 27px; border:1px solid var(--clay); background:var(--clay); color:#fff; text-decoration:none; text-transform:uppercase; letter-spacing:.13em; font-size:.7rem; font-weight:600; transition:background .25s, color .25s, transform .25s; }
    .button:hover, .button:focus-visible { background:transparent; color:var(--paper); transform:translateY(-2px); }
    .text-link { color:var(--paper); text-decoration:none; font-size:.72rem; font-weight:600; letter-spacing:.13em; text-transform:uppercase; border-bottom:1px solid rgba(250,243,231,.5); padding:10px 0; }
    .text-link:hover, .text-link:focus-visible { color:#e8966a; border-color:#e8966a; }
    .hero-footer { position:relative; z-index:1; margin:0 clamp(22px,5vw,72px); padding:19px 0; border-top:1px solid var(--line); display:flex; justify-content:space-between; gap:20px; color:rgba(250,243,231,.56); font-size:.63rem; font-weight:500; letter-spacing:.14em; text-transform:uppercase; }
    .scroll { display:flex; align-items:center; gap:10px; }
    .scroll::before { content:""; display:block; width:28px; height:1px; background:#e8966a; }
    @media (max-width:560px) { nav { min-height:70px; } .wordmark { font-size:1.18rem; } .content { justify-content:flex-start; padding-top:clamp(115px,20vh,155px); } h1 { font-size:clamp(4.3rem,22vw,6.6rem); line-height:.8; } .subcopy { margin-top:28px; } .hero-footer span:last-child { display:none; } }
    @media (prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } }
  </style>
</head>
<body>
  <!-- Main landing section: hero background, nav, headline, and CTA content -->
  <main class="hero" id="home">
    <!-- Animated background canvas for the floating dust effect -->
    <canvas id="dust" aria-hidden="true"></canvas>
    <div class="wash"></div><div class="grain"></div>

    <!-- Header navigation: brand name and entry link -->
    <nav aria-label="Main navigation">
      <a class="wordmark" href="#home" aria-label="SBNTS home">SBNTS</a>
      <a class="nav-link" href="SBNTS.html">Enter closet</a>
    </nav>
    <!-- Hero content block: headline, supporting copy, and action buttons -->
    <section class="content" aria-labelledby="headline">
      <p class="eyebrow">Similar but not the same</p>
      <h1 id="headline">Wear the <em>difference.</em></h1>
      <p class="subcopy">A considered wardrobe for people who find their own way through the familiar.</p>
      <div class="actions">
        <a class="button" href="SBNTS.html">Shop the closet</a>
        <a class="text-link" href="SBNTS.html#about">Our point of view</a>
      </div>
    </section>

    <!-- Footer text under the hero section -->
    <footer class="hero-footer">
      <span class="scroll">Shop to wander</span>
      <span>Made for individual expression</span>
    </footer>
  </main>

  <!-- Interactive background script: dust particle animation and pointer effects -->
  <script>
    (() => {
      const canvas = document.getElementById('dust');
      const context = canvas.getContext('2d');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let particles = [], pointer = { x: -9999, y: -9999 }, frame, clock = 0;

      function resize() {
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = innerWidth * ratio; canvas.height = innerHeight * ratio;
        canvas.style.width = innerWidth + 'px'; canvas.style.height = innerHeight + 'px';
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
        const count = Math.min(390, Math.max(150, Math.round(innerWidth / 3.6)));
        particles = Array.from({ length: count }, () => ({
          seed: Math.random() * Math.PI * 2,
          loop: Math.random() * Math.PI * 2,
          band: Math.floor(Math.random() * 4),
          radius: Math.pow(Math.random(), .78),
          size: Math.random() * 2.1 + .45,
          alpha: Math.random() * .42 + .42,
          previousX: 0, previousY: 0
        }));
      }
      function position(p, time) {
        const mobile = innerWidth < 560;
        const anchorX = innerWidth * (mobile ? .68 : .74);
        const anchorY = innerHeight * .53;
        const spread = Math.min(innerWidth, innerHeight) * (mobile ? .38 : .52) * p.radius;
        const wave = time * .62 + p.seed;
        const twist = wave + Math.sin(time * .28 + p.loop) * .9;
        const longArc = Math.sin(wave * .56 + p.band * 1.7) * spread * 1.28;
        const x = anchorX + Math.cos(twist) * spread * .72 + longArc;
        const y = anchorY + Math.sin(twist * 1.35 + p.band) * spread * .58 + Math.cos(wave * 1.9) * spread * .22;
        const dx = x - pointer.x, dy = y - pointer.y, distance = Math.hypot(dx, dy) || 1;
        const push = Math.max(0, 130 - distance) / 130;
        return { x: x + (dx / distance) * push * 42, y: y + (dy / distance) * push * 42 };
      }
      function draw() {
        context.clearRect(0, 0, innerWidth, innerHeight);
        clock += reducedMotion ? 0 : .008;
        for (const p of particles) {
          const point = position(p, clock);
          if (p.previousX) {
            context.beginPath(); context.moveTo(p.previousX, p.previousY); context.lineTo(point.x, point.y);
            context.strokeStyle = `rgba(232, 150, 106, ${p.alpha * .30})`; context.lineWidth = p.size * .48; context.stroke();
          }
          context.beginPath(); context.arc(point.x, point.y, p.size, 0, Math.PI * 2);
          context.fillStyle = `rgba(255, 220, 174, ${p.alpha})`; context.fill();
          if (p.size > 1.35) {
            context.beginPath(); context.arc(point.x, point.y, p.size * 3.4, 0, Math.PI * 2);
            context.fillStyle = `rgba(232, 150, 106, ${p.alpha * .13})`; context.fill();
          }
          p.previousX = point.x; p.previousY = point.y;
        }
        if (!reducedMotion) frame = requestAnimationFrame(draw);
      }
      addEventListener('pointermove', event => { pointer.x=event.clientX; pointer.y=event.clientY; });
      addEventListener('pointerleave', () => { pointer.x=-9999; pointer.y=-9999; });
      addEventListener('resize', () => { cancelAnimationFrame(frame); resize(); draw(); });
      resize(); draw();
    })();
  </script>
</body>
</html>
